name: macOS CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test-build-package:
    runs-on: macos-26
    outputs:
      version: ${{ steps.package_meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Test
        run: swift test

      - name: Build
        run: swift build

      - name: Package local app bundle
        run: Scripts/build-app.sh

      - name: Verify packaged app signature
        run: |
          codesign -dv --verbose=4 dist/ReadBook.app
          codesign --verify --deep --strict --verbose=4 dist/ReadBook.app

      - name: Verify branding
        run: |
          test -s dist/ReadBook.app/Contents/Resources/ReadBook.icns
          test -s dist/ReadBook.app/Contents/Resources/ReadBookMenuTemplate.png
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' dist/ReadBook.app/Contents/Info.plist)" = "ReadBook.icns"

      - name: Gatekeeper assessment
        run: |
          spctl --assess --type execute --verbose=4 dist/ReadBook.app || true

      - name: Create archive and checksum
        id: package_meta
        run: |
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' dist/ReadBook.app/Contents/Info.plist)"
          test -n "$VERSION"
          ditto -c -k --sequesterRsrc --keepParent dist/ReadBook.app dist/ReadBook-macOS.zip
          cd dist
          shasum -a 256 ReadBook-macOS.zip > ReadBook-macOS.zip.sha256
          shasum -a 256 -c ReadBook-macOS.zip.sha256
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload installable preview
        uses: actions/upload-artifact@v4
        with:
          name: ReadBook-v${{ steps.package_meta.outputs.version }}-${{ github.sha }}
          path: |
            dist/ReadBook-macOS.zip
            dist/ReadBook-macOS.zip.sha256
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test-build-package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified package
        uses: actions/download-artifact@v4
        with:
          name: ReadBook-v${{ needs.test-build-package.outputs.version }}-${{ github.sha }}
          path: dist

      - name: Verify downloaded checksum
        run: |
          cd dist
          sha256sum -c ReadBook-macOS.zip.sha256

      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.test-build-package.outputs.version }}
        run: |
          TAG="v$VERSION"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$TAG already exists; leaving the published binary immutable."
            exit 0
          fi

          gh release create "$TAG" \
            dist/ReadBook-macOS.zip \
            dist/ReadBook-macOS.zip.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "ReadBook $TAG" \
            --notes "ReadBook $TAG 原生窗口与连续滚动重构版本。\n\n- 恢复原生 macOS titlebar 拖动，视觉上隐藏系统标题文字与红黄绿按钮\n- 使用原生窗口边缘/角落 resize，删除自制 resize overlay\n- 连续阅读改用 NSTextView.scrollableTextView() 提供的原生 NSScrollView\n- production 连续滚动链路移除 VirtualTextWindow/recenter，不再在滚动边缘重建文本窗口\n- 滚动 position 写回在短暂静默后合并上报，反馈回来的同一 position 不再反向驱动 viewport，避免回弹\n- 保留隐藏滚动条、主题、字体与文字颜色、分页模式、老板模式、阅读进度与窗口外观设置\n- 新增真实 scrollWheel、viewport feedback、saved-anchor 与原生窗口契约回归测试\n\n说明：当前仍为 ad-hoc 签名，未使用 Apple Developer ID/notarization。首次下载安装时 macOS 可能仍需要右键 ReadBook.app → 打开。"

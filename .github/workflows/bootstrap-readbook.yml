name: macOS CI

on:
  push:
    branches: ["main", "feature/readbook-v1"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test-build-package:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Test
        run: swift test

      - name: Build
        run: swift build

      - name: Package local app bundle
        run: Scripts/build-app.sh

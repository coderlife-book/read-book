name: macOS CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test-build-package:
    runs-on: macos-26
    outputs:
      version: ${{ steps.package_meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Test
        run: swift test

      - name: Build
        run: swift build

      - name: Package local app bundle
        run: Scripts/build-app.sh

      - name: Verify packaged app signature
        run: |
          codesign -dv --verbose=4 dist/ReadBook.app
          codesign --verify --deep --strict --verbose=4 dist/ReadBook.app

      - name: Verify branding
        run: |
          test -s dist/ReadBook.app/Contents/Resources/ReadBook.icns
          test -s dist/ReadBook.app/Contents/Resources/ReadBookMenuTemplate.png
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' dist/ReadBook.app/Contents/Info.plist)" = "ReadBook.icns"

      - name: Gatekeeper assessment
        run: |
          spctl --assess --type execute --verbose=4 dist/ReadBook.app || true

      - name: Create archive and checksum
        id: package_meta
        run: |
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' dist/ReadBook.app/Contents/Info.plist)"
          test -n "$VERSION"
          ditto -c -k --sequesterRsrc --keepParent dist/ReadBook.app dist/ReadBook-macOS.zip
          cd dist
          shasum -a 256 ReadBook-macOS.zip > ReadBook-macOS.zip.sha256
          shasum -a 256 -c ReadBook-macOS.zip.sha256
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload installable preview
        uses: actions/upload-artifact@v4
        with:
          name: ReadBook-v${{ steps.package_meta.outputs.version }}-${{ github.sha }}
          path: |
            dist/ReadBook-macOS.zip
            dist/ReadBook-macOS.zip.sha256
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test-build-package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified package
        uses: actions/download-artifact@v4
        with:
          name: ReadBook-v${{ needs.test-build-package.outputs.version }}-${{ github.sha }}
          path: dist

      - name: Verify downloaded checksum
        run: |
          cd dist
          sha256sum -c ReadBook-macOS.zip.sha256

      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.test-build-package.outputs.version }}
        run: |
          TAG="v$VERSION"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$TAG already exists; leaving the published binary immutable."
            exit 0
          fi

          gh release create "$TAG" \
            dist/ReadBook-macOS.zip \
            dist/ReadBook-macOS.zip.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "ReadBook $TAG" \
            --notes "ReadBook $TAG 稳定性硬化版本。\n\n- 应用退出不再等待异步阅读进度保存，避免 ReadBook 拖住 macOS 注销、重启或关机\n- 分页触控板翻页移除最后一个 NSEvent 本地 monitor，滚轮事件仅由阅读视图自己处理\n- 窗口置顶、鼠标穿透、阴影与 App activation policy 改为幂等更新，减少无意义的 AppKit 重入\n- 更新包 SHA-256、ditto 解压与 codesign 校验移出 MainActor，不再阻塞阅读器 UI\n- 更新子进程增加 60 秒硬超时；替换 helper 等旧进程退出增加 30 秒硬超时，消除无限等待路径\n- v0.1.6 首次启动一次性切到普通 App 模式，使 ReadBook 出现在 Dock/强制退出应用中；之后仍可手动切回隐藏 Dock\n- 保持无全局键盘、Option、系统级鼠标监听，以及原生 mouseDownCanMoveWindow 拖动策略\n\n说明：当前仍为 ad-hoc 签名，未使用 Apple Developer ID/notarization。首次下载安装时 macOS 可能仍需要右键 ReadBook.app → 打开。"

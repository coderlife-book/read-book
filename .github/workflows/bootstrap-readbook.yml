name: macOS CI

on:
  push:
    branches: ["main", "feature/readbook-v1", "fix/release-codesign"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  test-build-package:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Test
        run: swift test

      - name: Build
        run: swift build

      - name: Package local app bundle
        run: Scripts/build-app.sh

      - name: Verify packaged app signature
        run: |
          codesign -dv --verbose=4 dist/ReadBook.app
          codesign --verify --deep --strict --verbose=4 dist/ReadBook.app

      - name: Gatekeeper assessment
        run: |
          spctl --assess --type execute --verbose=4 dist/ReadBook.app || true

      - name: Create release archive
        if: github.ref == 'refs/heads/main'
        run: ditto -c -k --sequesterRsrc --keepParent dist/ReadBook.app dist/ReadBook-macOS.zip

      - name: Publish v0.1.1
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.1 >/dev/null 2>&1; then
            gh release upload v0.1.1 dist/ReadBook-macOS.zip --clobber
          else
            gh release create v0.1.1 \
              dist/ReadBook-macOS.zip \
              --target "$GITHUB_SHA" \
              --title "ReadBook v0.1.1" \
              --notes "修复 v0.1.0 下载后被 macOS 判定为‘已损坏’的问题。\n\n- 对最终 ReadBook.app bundle 重新执行 ad-hoc codesign\n- 将 Info.plist 与 bundle resources 纳入签名封印\n- CI 新增 codesign --verify --deep --strict 门槛\n- 保留 v0.1.0 的全部阅读功能\n\n说明：本版本仍未使用 Apple Developer ID 与 notarization。首次运行若出现未认证开发者提示，请右键 ReadBook.app → 打开，或到 系统设置 → 隐私与安全性 → 仍要打开。"
          fi

name: macOS CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test-build-package:
    runs-on: macos-26
    outputs:
      version: ${{ steps.package_meta.outputs.version }}
      release_required: ${{ steps.release_policy.outputs.release_required }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine change scope
        id: change_scope
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            BASE_SHA="$PUSH_BASE_SHA"
          else
            BASE_SHA="$PR_BASE_SHA"
          fi
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"

          changed_files="$RUNNER_TEMP/readbook-changed-files"
          git diff --name-only "$BASE_SHA" "$GITHUB_SHA" > "$changed_files"

          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            echo "needs_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          needs_build=false
          while IFS= read -r file; do
            case "$file" in
              AGENTS.md|README.md|docs/*) ;;
              *) needs_build=true; break ;;
            esac
          done < "$changed_files"
          echo "needs_build=$needs_build" >> "$GITHUB_OUTPUT"

      - name: Release policy tests
        if: steps.change_scope.outputs.needs_build == 'true'
        run: bash Tests/ReleasePolicyTests.sh

      - name: Check release version policy
        id: release_policy
        if: steps.change_scope.outputs.needs_build == 'true'
        run: bash Scripts/check-release-policy.sh "${{ steps.change_scope.outputs.base_sha }}" "$GITHUB_SHA"

      - name: Documentation-only change
        if: steps.change_scope.outputs.needs_build != 'true'
        run: echo "Documentation-only change; skipping build and package steps."

      - name: Toolchain
        id: toolchain
        if: steps.change_scope.outputs.needs_build == 'true'
        run: |
          sw_vers
          xcodebuild -version
          swift --version

          toolchain_key="$({
            sw_vers -productVersion
            xcodebuild -version
            swift --version
          } | shasum -a 256 | cut -d ' ' -f 1)"
          echo "cache-key=$toolchain_key" >> "$GITHUB_OUTPUT"

      - name: Restore SwiftPM build cache
        id: swiftpm-cache
        if: steps.change_scope.outputs.needs_build == 'true'
        uses: actions/cache/restore@v5
        with:
          path: .build
          key: readbook-spm-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.cache-key }}-${{ hashFiles('Package.resolved') }}

      - name: Test
        if: steps.change_scope.outputs.needs_build == 'true'
        run: swift test -c release

      - name: Save SwiftPM build cache
        if: steps.change_scope.outputs.needs_build == 'true' && steps.swiftpm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .build
          key: ${{ steps.swiftpm-cache.outputs.cache-primary-key }}

      - name: Package local app bundle
        if: steps.change_scope.outputs.needs_build == 'true'
        env:
          READBOOK_SKIP_BUILD: "1"
        run: Scripts/build-app.sh

      - name: Verify packaged app signature
        if: steps.change_scope.outputs.needs_build == 'true'
        run: |
          codesign -dv --verbose=4 dist/ReadBook.app
          codesign --verify --deep --strict --verbose=4 dist/ReadBook.app

      - name: Verify branding
        if: steps.change_scope.outputs.needs_build == 'true'
        run: |
          test -s dist/ReadBook.app/Contents/Resources/ReadBook.icns
          test -s dist/ReadBook.app/Contents/Resources/ReadBookMenuTemplate.png
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' dist/ReadBook.app/Contents/Info.plist)" = "ReadBook.icns"

      - name: Gatekeeper assessment
        if: steps.change_scope.outputs.needs_build == 'true'
        run: |
          spctl --assess --type execute --verbose=4 dist/ReadBook.app || true

      - name: Create archive and checksum
        id: package_meta
        if: steps.change_scope.outputs.needs_build == 'true'
        run: |
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' dist/ReadBook.app/Contents/Info.plist)"
          test -n "$VERSION"
          ditto -c -k --sequesterRsrc --keepParent dist/ReadBook.app dist/ReadBook-macOS.zip
          cd dist
          shasum -a 256 ReadBook-macOS.zip > ReadBook-macOS.zip.sha256
          shasum -a 256 -c ReadBook-macOS.zip.sha256
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload installable preview
        if: steps.change_scope.outputs.needs_build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ReadBook-v${{ steps.package_meta.outputs.version }}-${{ github.sha }}
          path: |
            dist/ReadBook-macOS.zip
            dist/ReadBook-macOS.zip.sha256
          if-no-files-found: error
          retention-days: 14

  publish:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.test-build-package.outputs.release_required == 'true'
    needs: test-build-package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified package
        uses: actions/download-artifact@v4
        with:
          name: ReadBook-v${{ needs.test-build-package.outputs.version }}-${{ github.sha }}
          path: dist

      - name: Verify downloaded checksum
        run: |
          cd dist
          sha256sum -c ReadBook-macOS.zip.sha256

      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.test-build-package.outputs.version }}
        run: |
          TAG="v$VERSION"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::$TAG already exists. Product changes must increment APP_VERSION and APP_BUILD before merging."
            exit 1
          fi

          cat > release-notes.md <<EOF
          ReadBook $TAG 下载与更新可靠性修复。

          - Hugging Face / HF-compatible 镜像未提供 Content-Length 时不再直接终止模型下载
          - 未知文件大小时使用锁定模型的预估总大小展示进度，并继续保留 partial 断点文件
          - 内置更新最终保存阅读进度改为真正的硬超时，不再被不响应 cancellation 的保存任务永久拖住
          - 最终保存超时时仍继续安装已经下载并校验通过的更新，避免长期卡在“正在安装”

          说明：语音模型约 3.8 GB，不包含在安装包中。当前仍为 ad-hoc 签名，未使用 Apple Developer ID/notarization；首次下载安装时 macOS 可能仍需要右键 ReadBook.app → 打开。
          EOF

          gh release create "$TAG" \
            dist/ReadBook-macOS.zip \
            dist/ReadBook-macOS.zip.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "ReadBook $TAG" \
            --notes-file release-notes.md

name: macOS CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  test-build-package:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Test
        run: swift test

      - name: Build
        run: swift build

      - name: Package local app bundle
        run: Scripts/build-app.sh

      - name: Verify packaged app signature
        run: |
          codesign -dv --verbose=4 dist/ReadBook.app
          codesign --verify --deep --strict --verbose=4 dist/ReadBook.app

      - name: Gatekeeper assessment
        run: |
          spctl --assess --type execute --verbose=4 dist/ReadBook.app || true

      - name: Create release archive
        if: github.ref == 'refs/heads/main'
        run: ditto -c -k --sequesterRsrc --keepParent dist/ReadBook.app dist/ReadBook-macOS.zip

      - name: Publish v0.1.2
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.2 >/dev/null 2>&1; then
            gh release upload v0.1.2 dist/ReadBook-macOS.zip --clobber
          else
            gh release create v0.1.2 \
              dist/ReadBook-macOS.zip \
              --target "$GITHUB_SHA" \
              --title "ReadBook v0.1.2" \
              --notes "修复阅读性能与窗口顶部白条。\n\n- 连续滚动改为窗口化虚拟渲染，不再把整本小说一次性塞入 TextKit\n- 默认仅渲染约 12 万 UTF-16 单元，接近边缘时自动重心定位并保持全书阅读 offset\n- 阅读窗口移除原生 .titled titlebar，彻底去除顶部系统白色区域\n- 新增连续渲染上限与 borderless 窗口回归测试\n- 保留 v0.1.1 的完整 bundle ad-hoc 签名修复\n\n说明：仍未使用 Apple Developer ID 与 notarization。首次运行可能需要右键 ReadBook.app → 打开，或到系统设置 → 隐私与安全性 → 仍要打开。"
          fi
